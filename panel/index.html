<!doctype html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Panel · Hurus Barber Studio</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#080808">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='10' fill='%23080808'/%3E%3Ccircle cx='24' cy='24' r='17' fill='none' stroke='%23C8CACC' stroke-width='1.6'/%3E%3Ctext x='24' y='30' text-anchor='middle' font-family='Georgia,serif' font-size='17' font-weight='700' fill='%23EDEDF0'%3EH%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--canvas:#0A0A0C;--panel:#141417;--panel-2:#1B1B20;--panel-3:#232329;--accent:#C5C5D0;--accent-hover:#D8D8E2;--accent-muted:rgba(197,197,208,.20);--accent-ink:#0E0E12;--text-primary:#EDEDF0;--text-secondary:#A3A3AC;--text-muted:#6E6E78;--live:#C8CACC;--ok:#5FBF8A;--rule:rgba(237,237,240,.12);--rule-strong:rgba(237,237,240,.34);--f-display:"Cinzel",Georgia,serif;--f-body:"Geist",system-ui,sans-serif;--f-mono:"Geist Mono",ui-monospace,monospace;--e:cubic-bezier(.22,1,.36,1)}
[data-theme="light"]{--canvas:#F5F5F7;--panel:#FFFFFF;--panel-2:#F0F0F2;--panel-3:#E8E8EC;--text-primary:#0E0E12;--text-secondary:#55555C;--text-muted:#9090A0;--rule:rgba(0,0,0,.10);--rule-strong:rgba(0,0,0,.25);--accent:#2A2A30;--accent-hover:#1A1A22;--accent-muted:rgba(42,42,48,.12);--accent-ink:#FFFFFF}
*,*::before,*::after{box-sizing:border-box}
html,body{overflow-x:hidden;overflow-x:clip}
body{margin:0;background:var(--canvas);color:var(--text-primary);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,select{font:inherit;color:inherit}
a{color:inherit}
h1,h2,h3{margin:0;font-weight:500}
p{margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.demo{display:flex;justify-content:center;gap:8px;padding:6px 12px;background:var(--panel);border-bottom:1px solid var(--rule);font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:rgba(237,237,240,.65)}
.demo a{color:var(--accent);text-decoration:none}
/* PIN */
.pin{min-height:calc(100vh - 30px);display:grid;place-items:center;padding:24px}
.pin form{width:100%;max-width:360px;display:grid;gap:14px;justify-items:center;text-align:center}
.pin .aro{width:72px;height:72px;border-radius:50%;border:1px solid var(--accent);display:grid;place-items:center;font-family:var(--f-display);font-size:1.6rem;position:relative}
.pin .aro::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:1px solid var(--accent-muted)}
.pin h1{font-family:var(--f-display);font-size:1rem;letter-spacing:.2em;text-transform:uppercase}
.pin p{color:var(--text-secondary);font-size:.95rem}
.pin input{width:100%;text-align:center;font-family:var(--f-mono);font-size:1.6rem;letter-spacing:.5em;padding:12px;border-radius:8px;border:1px solid var(--rule-strong);background:var(--panel-2);color:var(--text-primary)}
.pin .err{color:#F08A80;font-size:.9rem;min-height:1.4em}
/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5em;min-height:44px;padding:10px 16px;border-radius:4px;border:1px solid transparent;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:15px;cursor:pointer;text-decoration:none;transition:background .2s var(--e),transform .2s var(--e);white-space:nowrap}
.btn:hover{background:var(--accent-hover)}
.btn.ghost{background:transparent;color:var(--text-primary);border-color:var(--rule-strong)}
.btn.ghost:hover{background:rgba(237,237,240,.06)}
.btn.rojo{background:transparent;color:var(--text-secondary);border-color:var(--rule-strong)}
.btn.sm{min-height:36px;padding:6px 12px;font-size:13px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
/* App */
.app{display:none}
.app.show{display:block}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px clamp(14px,3vw,28px);background:rgba(10,10,12,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--rule)}
.top .brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.top .brand b{font-family:var(--f-display);font-weight:600;letter-spacing:.16em;font-size:15px}
.top .brand small{display:block;font-family:var(--f-mono);font-size:9px;letter-spacing:.3em;color:var(--accent)}
.top .acts{display:flex;gap:8px}
.tabs{display:flex;gap:4px;overflow-x:auto;padding:10px clamp(14px,3vw,28px) 0;border-bottom:1px solid var(--rule);scrollbar-width:none;background:var(--canvas);position:sticky;top:65px;z-index:19}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:10px 14px 12px;border:0;background:transparent;color:var(--text-secondary);font-weight:500;font-size:15px;border-bottom:2px solid transparent;cursor:pointer;transition:color .2s var(--e),border-color .2s var(--e)}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.tab .n{font-family:var(--f-mono);font-size:11px;margin-left:6px;padding:1px 6px;border-radius:10px;background:var(--panel-3);color:var(--text-primary)}
.vista{padding:18px clamp(14px,3vw,28px) 80px;max-width:1100px;margin:0 auto;display:grid;gap:18px}
.fila-ctrl{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.campo{display:grid;gap:4px;min-width:0}
.campo label{font-size:.82rem;color:var(--text-secondary)}
.campo input,.campo select{min-height:42px;padding:8px 12px;border-radius:6px;border:1px solid var(--rule-strong);background:var(--panel-2);color:var(--text-primary);min-width:0;max-width:100%;color-scheme:dark}
.card{border:1px solid var(--rule);border-radius:10px;background:var(--panel);padding:16px;display:grid;gap:12px;align-content:start}
.card h2{font-family:var(--f-display);font-size:.95rem;letter-spacing:.14em;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center;gap:10px}
.card h2 span{font-family:var(--f-mono);font-size:12px;letter-spacing:.04em;text-transform:none;color:var(--text-secondary);font-weight:400}
.lista{display:grid;gap:8px}
.item{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;padding:12px 14px;border:1px solid var(--rule);border-radius:8px;background:var(--panel-2);align-items:center}
.item .h{font-family:var(--f-mono);font-size:1.05rem;color:var(--accent);min-width:52px}
.item .h.pos{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;border:1px solid var(--accent);font-size:1rem;min-width:0}
.item .q{display:grid;gap:2px}
.item .q b{font-weight:500}
.item .q small{color:var(--text-secondary);font-size:.86rem}
.item .acts{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.item.hecho{opacity:.55}
.badge{display:inline-block;font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:2px 7px;border-radius:3px;border:1px solid var(--rule-strong);color:var(--text-secondary);margin-left:6px;vertical-align:middle}
.badge.ok{color:var(--ok);border-color:rgba(95,191,138,.5)}
.badge.live{color:var(--live);border-color:rgba(200,202,204,.4)}
.badge.gold{color:var(--accent);border-color:var(--accent-muted)}
.vacio{padding:18px;border:1px dashed var(--rule-strong);border-radius:8px;color:var(--text-secondary);font-size:.95rem}
.dos{display:grid;gap:18px}
@media(min-width:860px){.dos{grid-template-columns:1fr 1fr}}
.form{display:grid;gap:10px}
@media(min-width:640px){.form.inline{grid-template-columns:repeat(auto-fit,minmax(140px,1fr));align-items:end}}
.toggle{display:flex;align-items:center;gap:10px;cursor:pointer}
.toggle input{width:18px;height:18px;accent-color:var(--accent)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.kpi{padding:12px 14px;border:1px solid var(--rule);border-radius:8px;background:var(--panel)}
.kpi b{display:block;font-family:var(--f-mono);font-size:1.5rem;font-weight:500;color:var(--accent)}
.kpi span{font-size:.82rem;color:var(--text-secondary)}
.stats-range{display:flex;flex-wrap:wrap;gap:8px;align-items:end}
.stats-shortcuts{display:flex;flex-wrap:wrap;gap:6px}
.stats-shortcuts button{min-height:36px;padding:6px 10px}
.stats-chart{display:grid;gap:9px}
.stats-row{display:grid;grid-template-columns:minmax(110px,180px) minmax(70px,1fr) 52px;gap:10px;align-items:center}
.stats-label{color:var(--text-primary);font-size:.9rem;line-height:1.3;overflow-wrap:anywhere}
.stats-track{height:8px;background:var(--panel-3);border-radius:4px;overflow:hidden}
.stats-fill{height:100%;background:var(--accent);border-radius:4px;transition:width .3s var(--e)}
.stats-value{font-family:var(--f-mono);font-size:.84rem;text-align:right;color:var(--text-primary)}
.stats-note{padding:10px 12px;border-left:2px solid var(--accent);background:var(--panel-2);color:var(--text-secondary);font-size:.84rem}
@media(max-width:480px){.stats-row{grid-template-columns:minmax(86px,120px) minmax(45px,1fr) 42px;gap:7px}.stats-label{font-size:.82rem}}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,16px);z-index:70;padding:10px 16px;border-radius:8px;background:var(--panel-3);border:1px solid var(--rule-strong);font-size:.92rem;opacity:0;pointer-events:none;transition:opacity .3s var(--e),transform .3s var(--e);max-width:calc(100% - 24px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.nota{color:var(--text-muted);font-size:.85rem}
/* Stats */
.stats-range{display:flex;flex-wrap:wrap;gap:10px;align-items:end;padding-bottom:4px}
.stats-shortcuts{display:flex;gap:6px;flex-wrap:wrap;align-self:end}
.stats-note{font-size:.82rem;color:var(--text-muted);line-height:1.6;padding:10px 12px;background:var(--panel-2);border-left:2px solid var(--rule-strong);border-radius:0 4px 4px 0;margin:0}
.stats-chart{display:grid;gap:8px}
.stats-row{display:flex;align-items:center;gap:8px}
.stats-label{flex:0 0 110px;max-width:110px;font-size:.82rem;font-weight:500;color:var(--text-primary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:480px){.stats-label{flex:0 0 78px;max-width:78px;font-size:.76rem}}
.stats-track{flex:1;min-width:30px;background:var(--panel-3);border-radius:2px;height:7px;overflow:hidden}
.stats-fill{height:100%;background:var(--accent);border-radius:2px;transition:width .4s var(--e)}
.stats-value{flex-shrink:0;min-width:24px;text-align:right;font-family:var(--f-mono);font-size:.8rem;color:var(--text-secondary)}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="demo">Panel del dueño · Demo por VELO · datos ilustrativos</div>

<section class="pin" id="pin">
  <form id="pin-form" autocomplete="off">
    <div class="aro" aria-hidden="true">
      <svg viewBox="0 0 48 48" width="44" height="44" aria-hidden="true"><circle cx="24" cy="24" r="21" fill="none" stroke="currentColor" stroke-width="1.4"/><text x="24" y="29.5" text-anchor="middle" font-family="Cinzel,Georgia,serif" font-size="15" font-weight="600" fill="currentColor">H</text></svg>
    </div>
    <h1>Hurus · Panel</h1>
    <p>Escribe el PIN de 4 dígitos para entrar.</p>
    <label class="sr" for="pin-in">PIN</label>
    <input id="pin-in" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="····" autofocus>
    <div class="err" id="pin-err" aria-live="polite"></div>
    <button class="btn wide" type="submit">Entrar</button>
    <p class="nota">Para la demo el PIN está en el LEEME de la carpeta.</p>
  </form>
</section>

<div class="app" id="app">
  <header class="top">
    <a class="brand" href="../index.html">
      <svg viewBox="0 0 48 48" width="28" height="28" aria-hidden="true"><circle cx="24" cy="24" r="21" fill="none" stroke="currentColor" stroke-width="1.4"/><text x="24" y="29.5" text-anchor="middle" font-family="Cinzel,Georgia,serif" font-size="15" font-weight="600" fill="currentColor">H</text></svg>
      <span><b>HURUS</b><small>PANEL</small></span>
    </a>
    <div class="acts">
      <button class="btn ghost sm" type="button" id="btn-tema" aria-label="Cambiar tema" title="Modo día / noche">☀</button>
      <a class="btn ghost sm" href="../index.html" target="_blank" rel="noopener">Ver el sitio</a>
      <button class="btn ghost sm" type="button" id="salir">Salir</button>
    </div>
  </header>
  <div class="tabs" role="tablist" aria-label="Secciones del panel" id="tabs">
    <button class="tab" role="tab" aria-selected="true" data-tab="hoy" id="tab-hoy">Hoy</button>
    <button class="tab" role="tab" aria-selected="false" data-tab="bloqueos" id="tab-bloqueos">Bloquear horas</button>
    <button class="tab" role="tab" aria-selected="false" data-tab="barberos" id="tab-barberos">Barberos</button>
    <button class="tab" role="tab" aria-selected="false" data-tab="agendas" id="tab-agendas">Agendas</button>
    <button class="tab" role="tab" aria-selected="false" data-tab="stats" id="tab-stats">Estadísticas</button>
    <button class="tab" role="tab" aria-selected="false" data-tab="ajustes" id="tab-ajustes">Ajustes</button>
    <button class="tab" role="tab" aria-selected="false" data-tab="admin" id="tab-admin">Administrador</button>
    <button class="tab" role="tab" aria-selected="false" data-tab="instructivo" id="tab-instructivo">Instructivo</button>
  </div>
  <main class="vista" id="vista" role="tabpanel"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="../datos.js?v=17"></script>
<script src="../comun.js?v=5"></script>
<script src="panel.js?v=10"></script>
<script>
/* Toggle día/noche */
(function(){
  var btn = document.getElementById('btn-tema');
  var html = document.documentElement;
  var saved = localStorage.getItem('hurus:tema') || 'dark';
  function aplicar(t){ html.setAttribute('data-theme', t==='light'?'light':''); btn.textContent = t==='light'?'🌙':'☀'; }
  aplicar(saved);
  if(btn) btn.addEventListener('click', function(){
    var next = html.getAttribute('data-theme')==='light'?'dark':'light';
    localStorage.setItem('hurus:tema', next); aplicar(next);
  });
})();
</script>
</body>
</html>
